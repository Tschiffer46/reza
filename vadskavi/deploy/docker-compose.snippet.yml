# =============================================================================
# VadSkaVi — tjänster att klistra in i /home/deploy/hosting/docker-compose.yml
# =============================================================================
# OBS! Detta är ETT UTDRAG, inte en komplett compose-fil. Lägg in `vadskavi`
# och `vadskavi-db` under `services:`, och `vadskavi-db-data` under `volumes:`.
#
# NÄTVERK — VIKTIGT ATT VERIFIERA:
#   `hosting_web` antas vara det externa nätverk som Nginx Proxy Manager ligger
#   på (enligt reza-dokumentationen, gateway 172.18.0.1). Bekräfta med:
#       docker network ls
#   och justera namnet nedan om det heter något annat. Lägg även till
#   nätverken under det översta `networks:`-blocket i compose-filen:
#
#     networks:
#       hosting_web:
#         external: true
#       vadskavi-internal:
#         driver: bridge
# =============================================================================

  vadskavi:
    image: ghcr.io/tschiffer46/vadskavi:latest
    container_name: vadskavi
    restart: unless-stopped
    # Host-port 3457 (intern app-port) — NPM når annars containern via nätverksnamn.
    ports:
      - "127.0.0.1:3457:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vadskavi:${VADSKAVI_DB_PASSWORD}@vadskavi-db:5432/vadskavi
      AUTH_SECRET: ${VADSKAVI_AUTH_SECRET}
      AUTH_URL: https://vadskavi.nu
      AUTH_TRUST_HOST: "true"
      EMAIL_SERVER_HOST: mail.schiffer.se
      EMAIL_SERVER_PORT: "587"
      EMAIL_SERVER_USER: noreply@vadskavi.nu
      EMAIL_SERVER_PASSWORD: ${VADSKAVI_SMTP_PASSWORD}
      EMAIL_FROM: "VadSkaVi <noreply@vadskavi.nu>"
      ANTHROPIC_API_KEY: ${VADSKAVI_ANTHROPIC_API_KEY}
    depends_on:
      vadskavi-db:
        condition: service_healthy
    networks:
      - hosting_web
      - vadskavi-internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  vadskavi-db:
    image: postgres:16-alpine
    container_name: vadskavi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vadskavi
      POSTGRES_DB: vadskavi
      POSTGRES_PASSWORD: ${VADSKAVI_DB_PASSWORD}
    volumes:
      - vadskavi-db-data:/var/lib/postgresql/data
    networks:
      - vadskavi-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vadskavi -d vadskavi"]
      interval: 10s
      timeout: 5s
      retries: 5

# --- lägg till under volumes: ---
#   vadskavi-db-data:
