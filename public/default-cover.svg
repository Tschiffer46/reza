<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Lantligt kök">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe1"/>
      <stop offset="1" stop-color="#ece2cf"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7eef0"/>
      <stop offset="1" stop-color="#f3f0e6"/>
    </linearGradient>
  </defs>

  <!-- vägg -->
  <rect width="1200" height="300" fill="url(#wall)"/>

  <!-- fönster med utsikt över landet -->
  <g>
    <rect x="78" y="46" width="266" height="180" rx="8" fill="#b58d57"/>
    <rect x="92" y="60" width="238" height="152" rx="4" fill="url(#sky)"/>
    <!-- kullar -->
    <path d="M92 168 q60 -34 120 -8 q60 26 118 -6 V212 H92 Z" fill="#bcd0a6"/>
    <path d="M92 188 q70 -22 130 -2 q58 18 108 -6 V212 H92 Z" fill="#9cba86"/>
    <!-- sol -->
    <circle cx="285" cy="92" r="16" fill="#f0d59a"/>
    <!-- spröjs -->
    <rect x="208" y="60" width="6" height="152" fill="#b58d57"/>
    <rect x="92" y="132" width="238" height="6" fill="#b58d57"/>
  </g>

  <!-- hylla med burkar -->
  <g>
    <rect x="430" y="150" width="360" height="12" rx="3" fill="#c2a06a"/>
    <rect x="430" y="162" width="360" height="6" rx="3" fill="#a8854f"/>
    <!-- burk 1 -->
    <rect x="470" y="96" width="54" height="54" rx="8" fill="#e8e3d4"/>
    <rect x="476" y="86" width="42" height="14" rx="5" fill="#cdbf9f"/>
    <rect x="470" y="120" width="54" height="30" rx="6" fill="#d8cfb6"/>
    <!-- burk 2 -->
    <rect x="560" y="84" width="48" height="66" rx="8" fill="#eef0ea"/>
    <rect x="565" y="76" width="38" height="12" rx="5" fill="#c2a06a"/>
    <!-- skål -->
    <path d="M650 150 q40 0 80 0 q-6 26 -40 26 q-34 0 -40 -26 Z" fill="#c75b39"/>
    <path d="M650 150 q40 10 80 0" fill="none" stroke="#a8492d" stroke-width="3"/>
  </g>

  <!-- hängande kastruller -->
  <g>
    <rect x="900" y="62" width="230" height="7" rx="3" fill="#a8854f"/>
    <!-- panna -->
    <circle cx="955" cy="120" r="30" fill="#7c8a82"/>
    <circle cx="955" cy="120" r="20" fill="#8f9c94"/>
    <rect x="983" y="116" width="64" height="8" rx="4" fill="#5d6660" transform="rotate(18 983 120)"/>
    <line x1="955" y1="69" x2="955" y2="90" stroke="#5d6660" stroke-width="3"/>
    <!-- gryta -->
    <rect x="1030" y="96" width="58" height="44" rx="8" fill="#3f7d63"/>
    <rect x="1024" y="92" width="70" height="8" rx="4" fill="#2f5d49"/>
    <line x1="1059" y1="69" x2="1059" y2="92" stroke="#5d6660" stroke-width="3"/>
  </g>

  <!-- krukväxt på bänken -->
  <g>
    <path d="M360 252 q-22 -42 -6 -70 q14 22 8 70 Z" fill="#6f9170"/>
    <path d="M380 252 q22 -42 6 -70 q-14 22 -8 70 Z" fill="#7da37d"/>
    <path d="M372 252 q-2 -54 0 -78 q4 30 4 78 Z" fill="#8aa888"/>
    <path d="M352 250 h40 l-6 30 h-28 Z" fill="#c75b39"/>
  </g>

  <!-- bänkskiva -->
  <rect x="0" y="252" width="1200" height="48" fill="#d9c8a6"/>
  <rect x="0" y="252" width="1200" height="7" fill="#c7b487"/>
</svg>
