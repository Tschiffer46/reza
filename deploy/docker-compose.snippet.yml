# =============================================================================
# VadSkaVi — tjänster att klistra in i /home/deploy/hosting/docker-compose.yml
# =============================================================================
# Detta är ETT UTDRAG. Lägg `vadskavi` + `vadskavi-db` under `services:`, och
# `vadskavi_db_data:` under `volumes:`. Mönstret matchar serverns övriga appar
# (stegvis/forfor/voxtera): per-app env-fil, det interna `web`-nätet, inga
# host-portar (NPM når containern via namnet `vadskavi`), och resurslimits.
#
# Secrets ligger i en separat fil `/home/deploy/hosting/.env.vadskavi`
# (se .env.vadskavi.example) — INTE inline här.
# =============================================================================

  vadskavi:
    image: ghcr.io/tschiffer46/vadskavi:latest
    container_name: vadskavi
    restart: unless-stopped
    env_file:
      - .env.vadskavi
    depends_on:
      vadskavi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - vadskavi-uploads:/app/data/uploads
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - web

  vadskavi-db:
    image: postgres:16-alpine
    container_name: vadskavi-db
    restart: unless-stopped
    env_file:
      - .env.vadskavi
    environment:
      POSTGRES_USER: vadskavi
      POSTGRES_DB: vadskavi
    volumes:
      - vadskavi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vadskavi -d vadskavi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - web

