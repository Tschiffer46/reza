name: Setup Server (one-time)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Reza on Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            echo "=== Reza Server Setup ==="

            # 1. Verify PostgreSQL is reachable
            echo "Checking PostgreSQL connection..."
            psql "postgresql://reza:${{ secrets.DATABASE_PASSWORD }}@localhost:5432/reza" -c "SELECT 1;"
            echo "PostgreSQL OK!"

            # 2. Clone or update repo
            echo "Setting up repository..."
            if [ -d ~/reza/.git ]; then
              cd ~/reza
              git pull origin main
            else
              cd ~
              git clone https://github.com/Tschiffer46/reza.git
              cd ~/reza
            fi

            # 3. Create upload directory
            mkdir -p ~/reza/data/uploads

            # 4. Create .env.production
            echo "Creating .env.production..."
            cat > ~/reza/.env.production << ENVEOF
DATABASE_URL=postgresql://reza:${{ secrets.DATABASE_PASSWORD }}@localhost:5432/reza
REZA_PASSWORD=${{ secrets.REZA_PASSWORD }}
SESSION_SECRET=${{ secrets.SESSION_SECRET }}
ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
UPLOAD_DIR=/home/deploy/reza/data/uploads
HOSTNAME=0.0.0.0
PORT=3456
ENVEOF

            # 5. Source Node.js
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || true
            echo "Node version: $(node -v)"
            echo "npm version: $(npm -v)"

            # 6. Install dependencies
            echo "Installing dependencies..."
            cd ~/reza
            npm ci

            # 7. Run migrations
            echo "Running database migrations..."
            set -a; source .env.production; set +a
            npx prisma migrate deploy
            npx prisma generate

            # 8. Seed categories
            echo "Seeding categories..."
            npx prisma db seed || true

            # 9. Build
            echo "Building app..."
            npm run build

            # 10. Copy static files to standalone
            cp -r public .next/standalone/public
            cp -r .next/static .next/standalone/.next/static

            # 11. Verify systemd service is installed
            echo "Checking systemd service..."
            if ! systemctl is-enabled reza 2>/dev/null; then
              echo "ERROR: systemd service not installed."
              echo "Ask root to run: cp ~/reza/scripts/reza.service /etc/systemd/system/ && systemctl daemon-reload && systemctl enable reza"
              exit 1
            fi

            # 12. Restart via systemd (deploy user needs passwordless sudo for this)
            sudo systemctl restart reza

            # 13. Wait and verify
            sleep 3
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3456 | grep -q "3\|2"; then
              echo "=== SUCCESS! Reza is running on port 3456 ==="
            else
              echo "=== WARNING: App might not be responding yet ==="
              sudo journalctl -u reza -n 20 --no-pager
            fi
